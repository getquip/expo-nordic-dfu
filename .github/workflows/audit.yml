name: Audit
on:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  run:
    name: npm Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # This package ships no runtime dependencies (only peerDependencies), so
      # anything reachable by a consumer is covered by --omit=dev. That is the
      # gate.
      - name: Audit shipped dependencies
        run: npm audit --audit-level=high --omit=dev
      # Every current advisory is transitive build tooling (expo/metro/react-native
      # CLI). npm's only offered remedy is downgrading to expo@53 / react-native@0.72,
      # which would undo the SDK 55 upgrade, so this is reported rather than gated.
      # Without this split the job is red on every commit and gates nothing.
      - name: Report dev-dependency advisories (non-blocking)
        continue-on-error: true
        run: npm audit --audit-level=high
