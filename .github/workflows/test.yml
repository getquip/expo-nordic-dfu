name: Test
on:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  typescript:
    name: Typescript Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Type Check (Compile) TypeScript
        run: |
          set -euo pipefail
          npx tsc
          # Use git status, not git diff: a newly emitted file is untracked and
          # git diff would not see it.
          if [ -n "$(git status --porcelain)" ]; then
            echo "❌ Emitted files found, please compile your TypeScript code before submitting a PR"
            git status --porcelain
            git diff
            exit 1
          fi
          echo "✅ No files emitted"

  jest:
    name: Jest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run tests
        run: npm test
